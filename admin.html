<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | Akari Import</title>
<link rel="stylesheet" href="styles.css">
<style>
main{max-width:1200px;margin:35px auto;padding:20px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}
.tabs button{border:1px solid var(--line);background:white;border-radius:8px;padding:10px}
.tabs button.active{background:var(--green,#315b49);color:white}
.panel{background:white;border:1px solid var(--line);padding:20px;border-radius:12px;margin:12px 0}
.gridform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gridform label,.toolbar label{font-size:12px;font-weight:600}
.gridform input,.gridform textarea,.gridform select,.toolbar input,.toolbar select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:7px}
.gridform input[type=checkbox],.toolbar input[type=checkbox]{width:auto;margin:0 6px 0 0}
.wide{grid-column:1/-1}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.action{border:1px solid var(--line);background:white;border-radius:6px;padding:7px;cursor:pointer}
.hidden{display:none!important}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;background:#fafaf7}
.box h3{margin:0 0 4px;font-size:15px}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.toolbar .row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.pill.ok{background:#ecfdf5;color:#047857}
.pill.off{background:#fef2f2;color:#b91c1c}
#status{margin:10px 0;font-size:13px}
.primary{background:var(--green,#315b49);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.muted{color:#68756e;font-size:13px}
.small{font-size:12px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><span>AKARI <b>IMPORT</b></span></a>
  <nav><a href="index.html">Ver tienda</a><button class="outline" id="logoutBtn">Salir</button></nav>
</header>
<main>
  <div class="admin-head"><div><h1 style="margin:0">Panel de administración</h1><p class="muted" id="adminUser"></p></div></div>
  <div class="tabs">
    <button class="active" data-tab="products">Productos</button>
    <button data-tab="orders">Pedidos</button>
    <button data-tab="resellers">Revendedores</button>
    <button data-tab="history">Historial</button>
  </div>
  <section id="productsPanel" class="panel">
    <h2>Productos</h2>
    <form id="productForm" class="gridform">
      <input type="hidden" id="id">
      <label>SKU<input id="sku" required></label>
      <label>Nombre<input id="name" required></label>
      <label>Precio minorista (ARS)<input id="retail" type="number" min="0" required></label>
      <label>Precio mayorista (ARS)<input id="wholesale" type="number" min="0" required></label>
      <label>Categoría<input id="category" value="General"></label>
      <label>Stock (cantidad)<input id="stock" type="number" min="0" step="1" placeholder="Vacío = no controla"></label>
      <label>Imagen URL (HTTPS)<input id="image" type="url" placeholder="https://…"></label>
      <label class="wide">Descripción<textarea id="description" rows="2"></textarea></label>
      <label><input type="checkbox" id="active" checked> Publicado</label>
      <div class="wide"><button class="primary">Guardar producto</button> <button type="button" class="action" id="clearForm">Limpiar</button></div>
    </form>
    <div class="box" id="bulkBox">
      <h3>Modificación masiva</h3>
      <p class="muted small">Tildá productos y aplicá cambios. Campos vacíos = sin cambios. <b id="selCount">0 seleccionados</b></p>
      <div class="toolbar">
        <label>Nueva categoría<input id="bulkCategory" placeholder="Sin cambios"></label>
        <label>Publicación<select id="bulkActive"><option value="">Sin cambios</option><option value="true">Publicar</option><option value="false">Ocultar</option></select></label>
        <label>Stock / disponibilidad<select id="bulkStockStatus"><option value="">Sin cambios</option><option value="out">Sin stock (0)</option><option value="qty">Fijar cantidad…</option></select></label>
        <label>Cantidad de stock<input id="bulkStockQty" type="number" min="0" step="1" placeholder="ej. 0, 5, 20"></label>
        <label>Precio minorista fijo<input id="bulkRetailPrice" type="number" min="0" step="1" placeholder="ARS"></label>
        <label>Precio mayorista fijo<input id="bulkWholesalePrice" type="number" min="0" step="1" placeholder="ARS"></label>
        <label>Minorista %<input id="bulkRetail" type="number" step="0.1" placeholder="+10 o -5"></label>
        <label>Mayorista %<input id="bulkWholesale" type="number" step="0.1" placeholder="+10 o -5"></label>
        <label>Redondear %<select id="bulkRound"><option value="1">$1</option><option value="10">$10</option><option value="100" selected>$100</option><option value="1000">$1000</option></select></label>
        <div class="row-btn"><button type="button" class="primary" id="bulkApply">Aplicar a seleccionados</button></div>
      </div>
    </div>
    <div class="toolbar" style="margin-bottom:10px">
      <label>Buscar<input id="productSearch" placeholder="SKU o nombre…"></label>
      <label>Categoría<select id="productCategoryFilter"><option value="">Todas</option></select></label>
      <label>Foto<select id="productPhotoFilter"><option value="">Todos</option><option value="sin">Sin foto</option><option value="con">Con foto</option></select></label>
      <label>Estado<select id="productStateFilter"><option value="">Todos</option><option value="pub">Publicados</option><option value="hid">Ocultos</option></select></label>
      <div class="muted small" id="filterCount"></div>
    </div>
    <div class="tablewrap"><table><thead><tr>
      <th><input type="checkbox" id="selectAll"></th><th></th><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Minorista</th><th>Mayorista</th><th>Stock</th><th>Estado</th><th></th>
    </tr></thead><tbody id="productRows"></tbody></table></div>
    <p id="status"></p>
    <input id="rowPhotoFile" type="file" accept="image/*" hidden>
  </section>
  <section id="ordersPanel" class="panel hidden"><h2>Pedidos</h2><div id="ordersBox"></div></section>
  <section id="resellersPanel" class="panel hidden"><h2>Revendedores</h2><div id="resellersBox"></div></section>
  <section id="historyPanel" class="panel hidden"><h2>Historial</h2><div id="historyBox"></div></section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
